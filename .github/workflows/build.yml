name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Install Flatpak tooling and runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder curl gnupg
          # Ensure Flathub remote is available
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Pre-install runtimes and Electron base to avoid long downloads during the build
          sudo flatpak install --system -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08 org.electronjs.Electron2.BaseApp//23.08 || true

      - name: Create Dist
        run: |
          ./dist.sh dist:linux:flatpak
          ls -l electron-starter/dist/

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: kontoauszuege-app-linux
          path: electron-starter/dist/*.flatpak

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Create Dist
        run: bash ./dist.sh dist:win
        shell: bash

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: kontoauszuege-app-windows
          path: electron-starter/dist/*.exe
