name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build (production mode)
        run: mvn clean package -Dvaadin.productionMode=true -Pproduction

      - name: Create Dist
        run: |
          ./dist.sh
          ls -l electron-starter/dist/

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: kontoauszuege-app-linux
          path: electron-starter/dist/kontoauszuege-app-linux.tar.gz

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Create Dist
        run: |
          ./dist.sh

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: kontoauszuege-app-windows
          path: electron-starter/dist/Kontoauszuege Setup 1.0.0.exe
