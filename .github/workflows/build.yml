name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build (production mode)
        run: mvn clean package -Dvaadin.productionMode=true -Pproduction

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kontoauszuege-app
          path: target/*.jar
