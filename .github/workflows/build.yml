name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Install Flatpak tooling and runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder curl gnupg
          # Ensure Flathub remote is available
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Pre-install runtimes and Electron base to avoid long downloads during the build
          sudo flatpak install --system -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08 org.electronjs.Electron2.BaseApp//23.08 || true

      - name: Create Dist
        run: |
          ./dist.sh dist:linux:flatpak
          ls -l electron-starter/dist/

      - name: Create GitHub release
        id: create_release_linux
        if: ${{ success() }}
        uses: actions/create-release@v1
        with:
          tag_name: v${{ github.run_number }}-linux
          release_name: Kontoauszuege flatpak (run ${{ github.run_number }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find Flatpak artifact
        id: find_flatpak
        run: |
          f=$(ls electron-starter/dist/*.flatpak 2>/dev/null | head -n1 || true)
          if [ -z "$f" ]; then
            echo "No flatpak artifact found" >&2
            exit 1
          fi
          echo "asset_path=$f" >> $GITHUB_OUTPUT
          echo "asset_name=$(basename \"$f\")" >> $GITHUB_OUTPUT

      - name: Upload Flatpak asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release_linux.outputs.upload_url }}
          asset_path: ${{ steps.find_flatpak.outputs.asset_path }}
          asset_name: ${{ steps.find_flatpak.outputs.asset_name }}
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Create Dist
        run: bash ./dist.sh dist:win
        shell: bash

      - name: Create GitHub release
        id: create_release_windows
        if: ${{ success() }}
        uses: actions/create-release@v1
        with:
          tag_name: v${{ github.run_number }}-windows
          release_name: Kontoauszuege windows (run ${{ github.run_number }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find EXE artifact
        id: find_exe
        run: |
          f=$(ls electron-starter/dist/*.exe 2>/dev/null | head -n1 || true)
          if [ -z "$f" ]; then
            echo "No exe artifact found" >&2
            exit 1
          fi
          echo "asset_path=$f" >> $GITHUB_OUTPUT
          echo "asset_name=$(basename \"$f\")" >> $GITHUB_OUTPUT

      - name: Upload EXE asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release_windows.outputs.upload_url }}
          asset_path: ${{ steps.find_exe.outputs.asset_path }}
          asset_name: ${{ steps.find_exe.outputs.asset_name }}
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
