name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Install Flatpak tooling and runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder curl gnupg
          # Ensure Flathub remote is available
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Pre-install runtimes and Electron base to avoid long downloads during the build
          sudo flatpak install --system -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08 org.electronjs.Electron2.BaseApp//23.08 || true

      - name: Create Dist
        run: |
          ./dist.sh dist:linux:flatpak
          ls -l electron-starter/dist/

      - name: Publish Flatpak as GitHub Release
        if: success()
        run: |
          TAG="v${{ github.run_number }}-linux"
          ASSET=$(ls electron-starter/dist/*.flatpak 2>/dev/null | head -n1)
          if [ -z "$ASSET" ]; then echo "No .flatpak artifact found"; exit 1; fi
          gh release create "$TAG" "$ASSET" \
            --title "Kontoauszuege flatpak (run ${{ github.run_number }})" \
            --notes "Automated build from run ${{ github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Flatpak as artifact for Pages deployment
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: electron-starter/dist/*.flatpak
          retention-days: 1

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Flatpak artifact
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle
          path: flatpak-bundle

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree gnupg

      - name: Import GPG signing key
        run: |
          echo "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" | base64 -d | gpg --import
          GPG_KEY_ID=$(gpg --list-keys --with-colons flatpak@kontoauszuege | grep '^fpr' | head -1 | cut -d: -f10)
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> $GITHUB_ENV

      - name: Create Flatpak repository
        run: |
          mkdir -p pages/repo
          ostree init --mode=archive-z2 --repo=pages/repo
          FLATPAK=$(ls flatpak-bundle/*.flatpak | head -n1)
          flatpak build-import-bundle pages/repo "$FLATPAK"
          COMMIT=$(ostree --repo=pages/repo rev-parse app/com.example.kontoauszuege/x86_64/stable)
          ostree gpg-sign --repo=pages/repo "$COMMIT" "$GPG_KEY_ID"
          flatpak build-update-repo --gpg-sign="$GPG_KEY_ID" pages/repo

      - name: Create .flatpakref and .flatpakrepo
        run: |
          GPG_PUBLIC_KEY=$(gpg --export "$GPG_KEY_ID" | base64 -w 0)
          sed "s/GPGKEY_PLACEHOLDER/$GPG_PUBLIC_KEY/" github-pages/kontoauszuege.flatpakref > pages/kontoauszuege.flatpakref
          sed "s/GPGKEY_PLACEHOLDER/$GPG_PUBLIC_KEY/" github-pages/kontoauszuege.flatpakrepo > pages/kontoauszuege.flatpakrepo

      - name: Create index.html
        run: cp github-pages/index.html pages/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Create Dist
        run: bash ./dist.sh dist:win
        shell: bash

      - name: Publish EXE as GitHub Release
        if: success()
        run: |
          $tag = "v${{ github.run_number }}-windows"
          $asset = Get-ChildItem electron-starter/dist/*.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $asset) { Write-Error "No .exe artifact found"; exit 1 }
          gh release create $tag $asset `
            --title "Kontoauszuege windows (run ${{ github.run_number }})" `
            --notes "Automated build from run ${{ github.run_number }}"  
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
