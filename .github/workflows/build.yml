name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Install Flatpak tooling and runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder curl gnupg
          # Ensure Flathub remote is available
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Pre-install runtimes and Electron base to avoid long downloads during the build
          sudo flatpak install --system -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08 org.electronjs.Electron2.BaseApp//23.08 || true

      - name: Create Dist
        run: |
          ./dist.sh dist:linux:flatpak
          ls -l electron-starter/dist/

      - name: Publish Flatpak as GitHub Release
        if: success()
        run: |
          TAG="v${{ github.run_number }}-linux"
          ASSET=$(ls electron-starter/dist/*.flatpak 2>/dev/null | head -n1)
          if [ -z "$ASSET" ]; then echo "No .flatpak artifact found"; exit 1; fi
          gh release create "$TAG" "$ASSET" \
            --title "Kontoauszuege flatpak (run ${{ github.run_number }})" \
            --notes "Automated build from run ${{ github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Create Dist
        run: bash ./dist.sh dist:win
        shell: bash

      - name: Publish EXE as GitHub Release
        if: success()
        run: |
          $tag = "v${{ github.run_number }}-windows"
          $asset = Get-ChildItem electron-starter/dist/*.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $asset) { Write-Error "No .exe artifact found"; exit 1 }
          gh release create $tag $asset `
            --title "Kontoauszuege windows (run ${{ github.run_number }})" `
            --notes "Automated build from run ${{ github.run_number }}"  
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
