# Converted from application.properties
#
# Hinweise:
# - Diese Datei wurde automatisch aus application.properties konvertiert.
# - Spring Boot lädt sowohl application.properties als auch application.yml;
#   entferne die alte properties-Datei wenn du ausschließlich YAML verwenden willst.

server:
  port: 8084
  address: 127.0.0.1

spring:
  application:
    name: kontoauszuege-app

  datasource:
    url: "jdbc:h2:file:${user.home}/.jbanking/jbanking;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# Vaadin settings
vaadin:
  launch-browser: true
  allowed-packages: com.example.kontoauszuege


bank-icons:
  - target: "sparkasse|Sparkasse"
    icon: "sparkasse-favicon2x.ico"
  - target: "VR meine Bank|VR-Bank|Volksbank|Raiffeisenbank"
    icon: "VRFavicon48x48.png"  
  - target: "paypal|PayPal"
    icon: "paypal-mark-color_new.svg" 
  - target: "UniCredit|Unicredit|HypoVereinsbank|HVB"
    icon: "hvb-favicon-32x32.png"

doc:
  keys:
    "Ordner":
      type: "enum"
      values:
        - "kg/schwalbennest"
        - "kg/sonnenblume"
    "Subordner":
        type: "enum"
        values:
            - "Gesundheit"
            - "Schule"
    "Typ":
        type: "enum"
        values:
            - "Rechnung"
            - "Quittung"
            - "Kontoauszug"
            - "Sonstiges"
    "Nummer":
        type: "string"
    "Text":
        type: "string"

  folder:
    - $Ordner
    - $Subordner
    - $Typ
  rules:
    - name: "Steuerbescheid1-Beleg"
      regexes:
        - pos: "60-100, 0-30, 1-"
          regex: ".*Steuerbescheid.*"
        - pos: "60-100, 0-30, 1-"
          regex: ".*Steuerbescheid.*"
      actions:
        - key: "Ordner"
          value: "kg/schwalbennest"
        - key: "Nummer"
          value: "<nr>"
