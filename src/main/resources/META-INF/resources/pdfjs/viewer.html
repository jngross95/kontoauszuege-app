<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Viewer (PDF.js)</title>
  <style>
    html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif}
    body{display:flex;flex-direction:column}
    .container{flex:1;display:flex;align-items:stretch;min-height:0}
    /* sidebar removed */
    .thumb{cursor:pointer;border:1px solid transparent;padding:4px;background:#fff}
    .thumb.selected{border-color:#06c}
    .thumb canvas{display:block;max-width:100%;height:auto}
    #viewerContainer{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;background:#999;padding:0;box-sizing:border-box;min-height:0}
    .selectionRect{position:absolute;border:2px solid red;background:rgba(255,0,0,0.06);pointer-events:none;display:none;z-index:9999}
    .pageCanvas{display:block;margin:0 auto;background:#fff;box-shadow:0 0 4px rgba(0,0,0,0.2);width:100%;height:auto}
    #toolbar{flex:0;display:flex;align-items:center;gap:8px;padding:6px;border-bottom:1px solid #ddd;background:#fafafa;box-sizing:border-box}
    #toolbar select, #toolbar button{padding:4px}
    .hidden{display:none}
    @media (max-width:800px){#sidebar{display:none}}
  </style>
</head>
  
</head>
<body>
  <div id="toolbar">
    <button id="prevPage">-</button>
    <span id="pageDisplay">1 / ?</span>
    <button id="nextPage">+</button>
    <label>Zoom:
      <select id="zoomSelect">
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1" selected>100%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
      </select>
    </label>
  </div>
  <div class="container">
    <main id="viewerContainer">
      <div id="viewerMessage">Lade PDF…</div>
    </main>
  </div>

  <script type="module">
    import * as pdfjsLib from './lib/pdf.mjs';
    (function(){
      const urlParams = new URLSearchParams(window.location.search);
      const pk = urlParams.get('filepk');
      if (!pk) { document.getElementById('viewerMessage').textContent = 'Kein Dokument angegeben'; return; }
      const pdfUrl = '/documents/pdf/' + encodeURIComponent(pk);

      // PDF.js worker config (ESM build)
      pdfjsLib.GlobalWorkerOptions.workerSrc = './lib/pdf.worker.mjs';

      const viewerContainer = document.getElementById('viewerContainer');
      const zoomSelect = document.getElementById('zoomSelect');
      const prevPageBtn = document.getElementById('prevPage');
      const nextPageBtn = document.getElementById('nextPage');
      const pageDisplay = document.getElementById('pageDisplay');

      let currentZoom = parseFloat(zoomSelect.value);
      zoomSelect.addEventListener('change', () => { currentZoom = parseFloat(zoomSelect.value); renderPage(currentPage); });

      let pdfDoc = null;
      let currentPage = 1;
      let totalPages = 0;
      const pageCanvases = [];

      prevPageBtn.addEventListener('click', () => { if (currentPage>1) renderPage(currentPage-1); });
      nextPageBtn.addEventListener('click', () => { if (currentPage<totalPages) renderPage(currentPage+1); });

      function updatePageDisplay() {
        pageDisplay.textContent = currentPage + ' / ' + (totalPages || '?');
      }

      function clearViewer() {
        viewerContainer.innerHTML = '';
        pageCanvases.length = 0;
      }

      function renderPageToCanvas(page, scale) {
        // ensure scale fills container width (avoid gray gutters)
        const orig = page.getViewport({scale:1});
        const containerWidth = Math.max(20, viewerContainer.clientWidth);
        const fitScale = containerWidth / orig.width;
        if (typeof scale === 'number') {
          scale = Math.max(scale, fitScale);
        } else {
          scale = fitScale;
        }
        const viewport = page.getViewport({scale});
        const canvas = document.createElement('canvas');
        canvas.className = 'pageCanvas';
        // use devicePixelRatio for crisp rendering
        const outputScale = window.devicePixelRatio || 1;
        const targetWidth = Math.floor(viewport.width);
        const targetHeight = Math.floor(viewport.height);
        canvas.width = Math.floor(targetWidth * outputScale);
        canvas.height = Math.floor(targetHeight * outputScale);
        // Displayed size: ensure it never exceeds container width to avoid horizontal scrollbar
        canvas.style.width = '100%';
        canvas.style.height = 'auto';
        const ctx = canvas.getContext('2d');
        ctx.setTransform(outputScale, 0, 0, outputScale, 0, 0);
        const renderTask = page.render({canvasContext: ctx, viewport});
        return renderTask.promise.then(() => canvas);
      }

      function renderPage(pageNum) {
        if (!pdfDoc) return;
        if (pageNum < 1 || pageNum > pdfDoc.numPages) return;
        currentPage = pageNum;
        updatePageDisplay();
        viewerContainer.innerHTML = '';
        return pdfDoc.getPage(pageNum).then(page => renderPageToCanvas(page, currentZoom).then(canvas => {
          canvas.dataset.pageNumber = pageNum;
          viewerContainer.appendChild(canvas);
          pageCanvases[pageNum] = canvas;
          setupSelection();
        }));
      }

      function setupSelection() {
        // remove existing selectionRect if any
        let sel = document.getElementById('selectionRect');
        if (sel) sel.remove();
        sel = document.createElement('div');
        sel.id = 'selectionRect';
        sel.className = 'selectionRect';
        viewerContainer.appendChild(sel);

        let isDragging = false;
        let startX = 0, startY = 0;
        let currentCanvas = null;

        function toViewerCoords(clientX, clientY, canvas) {
          const canvasRect = canvas.getBoundingClientRect();
          const vx = clientX - canvasRect.left;
          const vy = clientY - canvasRect.top;
          return {x: vx, y: vy, canvasRect};
        }

        // Use Pointer Events for snappy response and pointer capture
        let activePointerId = null;
        let cachedViewerRect = null;
        let cachedCanvasRect = null;
        let cachedViewerScrollTop = 0;

        viewerContainer.addEventListener('pointerdown', (e) => {
          const canvas = e.target.closest('.pageCanvas');
          if (!canvas) return;
          e.preventDefault();
          isDragging = true;
          currentCanvas = canvas;
          activePointerId = e.pointerId;
          // capture pointer to continue receiving events
          try { canvas.setPointerCapture(activePointerId); } catch (err) {}

          // cache rects to avoid reflow costs during move
          cachedViewerRect = viewerContainer.getBoundingClientRect();
          cachedCanvasRect = canvas.getBoundingClientRect();
          // record current vertical scroll position of the viewer
          cachedViewerScrollTop = viewerContainer.scrollTop;

          startX = e.clientX - cachedCanvasRect.left;
          startY = e.clientY - cachedCanvasRect.top;

          const left = (cachedCanvasRect.left - cachedViewerRect.left) + startX;
          // include scrollTop so sel is positioned relative to the viewer's content
          const top = (cachedCanvasRect.top - cachedViewerRect.top) + startY + cachedViewerScrollTop;
          sel.style.left = left + 'px';
          sel.style.top = top + 'px';
          sel.style.width = '0px';
          sel.style.height = '0px';
          sel.style.display = 'block';
          document.body.style.userSelect = 'none';
        });

        viewerContainer.addEventListener('pointermove', (e) => {
          if (!isDragging || !currentCanvas || e.pointerId !== activePointerId) return;
          // use cached rects for faster response
          const cx = e.clientX - cachedCanvasRect.left;
          const cy = e.clientY - cachedCanvasRect.top;
          const left = Math.min(startX, cx);
          const top = Math.min(startY, cy);
          const width = Math.abs(cx - startX);
          const height = Math.abs(cy - startY);
          sel.style.left = (cachedCanvasRect.left - cachedViewerRect.left + left) + 'px';
          sel.style.top = (cachedCanvasRect.top - cachedViewerRect.top + top + cachedViewerScrollTop) + 'px';
          sel.style.width = width + 'px';
          sel.style.height = height + 'px';
        });

        function finishSelection(e) {
          if (!isDragging || !currentCanvas) return;
          isDragging = false;
          document.body.style.userSelect = '';
          // release pointer capture
          try { currentCanvas.releasePointerCapture(activePointerId); } catch (err) {}
          activePointerId = null;

          // get final coords using cached rects (safe)
          const endX = (e && e.clientX ? e.clientX : (cachedCanvasRect.left + startX)) - cachedCanvasRect.left;
          const endY = (e && e.clientY ? e.clientY : (cachedCanvasRect.top + startY)) - cachedCanvasRect.top;
          const left = Math.min(startX, endX);
          const top = Math.min(startY, endY);
          const width = Math.abs(endX - startX);
          const height = Math.abs(endY - startY);
          sel.style.left = (cachedCanvasRect.left - cachedViewerRect.left + left) + 'px';
          sel.style.top = (cachedCanvasRect.top - cachedViewerRect.top + top + cachedViewerScrollTop) + 'px';
          sel.style.width = width + 'px';
          sel.style.height = height + 'px';

          // compute percentages relative to canvas displayed size
          const canvasW = cachedCanvasRect.width;
          const canvasH = cachedCanvasRect.height;
          const xFrom = (left / canvasW) * 100;
          const xTo = ((left + width) / canvasW) * 100;
          const yFrom = (top / canvasH) * 100;
          const yTo = ((top + height) / canvasH) * 100;

          // call backend extract API
          const pageNum = currentCanvas && currentCanvas.dataset ? currentCanvas.dataset.pageNumber : '1';
          fetch(`/documents/pdf/${encodeURIComponent(pk)}/extract?xFrom=${encodeURIComponent(xFrom)}&xTo=${encodeURIComponent(xTo)}&yFrom=${encodeURIComponent(yFrom)}&yTo=${encodeURIComponent(yTo)}&page=${encodeURIComponent(pageNum)}`)
            .then(r => { if (!r.ok) throw new Error('Server error ' + r.status); return r.text(); })
            .then(text => {
              if (!text) text = '(Keine Textausgabe)';
              const pageNum = currentCanvas && currentCanvas.dataset ? currentCanvas.dataset.pageNumber : '?';
              const coordStr = `xFrom=${xFrom.toFixed(2)}%, xTo=${xTo.toFixed(2)}%, yFrom=${yFrom.toFixed(2)}%, yTo=${yTo.toFixed(2)}%`;
              console.log('Seite: ' + pageNum + ' | Koordinaten: ' + coordStr + ' | Text: ' + text);
              if (navigator.clipboard && document.hasFocus()) {
                navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
              } else {
                fallbackCopy(text);
              }
            }).catch(err => { console.error('Fehler bei der Textextraktion:', err); })
            .finally(() => { setTimeout(() => { sel.style.display = 'none'; }, 800); });
        }

        function fallbackCopy(text) {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          try { document.execCommand('copy'); } catch(e) { console.warn('execCommand copy fehlgeschlagen:', e); }
          document.body.removeChild(ta);
        }

        viewerContainer.addEventListener('pointerup', finishSelection);
        viewerContainer.addEventListener('pointercancel', finishSelection);
      }

      pdfjsLib.getDocument({ url: pdfUrl }).promise.then(doc => {
        pdfDoc = doc;
        totalPages = doc.numPages;
        updatePageDisplay();
        // Render first page
        renderPage(1);
      }).catch(err=>{
        document.getElementById('viewerMessage').textContent = 'Fehler beim Laden des PDF: ' + err.message;
      });

      // sidebar removed
    })();
  </script>
</body>
</html>
