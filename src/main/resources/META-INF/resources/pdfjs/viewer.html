<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Viewer</title>
  <style>
    html,body{height:100%;margin:0}
    #viewer{padding:8px}
    canvas{display:block;margin:8px auto;max-width:100%;height:auto}
  </style>
</head>
<body>
  <div id="viewer">Lade PDF…</div>
  <!-- Use cdnjs build which exposes the pdfjsLib global reliably -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    (function(){
      const urlParams = new URLSearchParams(window.location.search);
      const pk = urlParams.get('filepk');
      if (!pk) { document.getElementById('viewer').textContent = 'Kein Dokument angegeben'; return; }
      const pdfUrl = '/documents/pdf/' + encodeURIComponent(pk);

      // Embed the PDF using the browser's native PDF viewer so text can be selected
      const container = document.getElementById('viewer');
      container.innerHTML = '';
      const iframe = document.createElement('iframe');
      iframe.src = pdfUrl;
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = 'none';
      iframe.title = 'PDF Viewer';
      container.style.height = '100vh';
      container.appendChild(iframe);
    })();
  </script>
</body>
</html>
