<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Viewer (PDF.js)</title>
  <style>
    html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif}
    .container{height:100%;display:flex;align-items:stretch}
    /* sidebar removed */
    .thumb{cursor:pointer;border:1px solid transparent;padding:4px;background:#fff}
    .thumb.selected{border-color:#06c}
    .thumb canvas{display:block;max-width:100%;height:auto}
    #viewerContainer{position:relative;flex:1;overflow:auto;background:#999;padding:8px;box-sizing:border-box}
    .selectionRect{position:absolute;border:2px solid red;background:rgba(255,0,0,0.06);pointer-events:none;display:none;z-index:9999}
    .pageCanvas{display:block;margin:8px auto;background:#fff;box-shadow:0 0 4px rgba(0,0,0,0.2)}
    #toolbar{display:flex;align-items:center;gap:8px;padding:6px;border-bottom:1px solid #ddd;background:#fafafa}
    #toolbar select, #toolbar button{padding:4px}
    .hidden{display:none}
    @media (max-width:800px){#sidebar{display:none}}
  </style>
</head>
  
</head>
<body>
  <div id="toolbar">
    <label>Zoom:
      <select id="zoomSelect">
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1" selected>100%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
      </select>
    </label>
  </div>
  <div class="container">
    <main id="viewerContainer">
      <div id="viewerMessage">Lade PDF…</div>
    </main>
  </div>

  <script type="module">
    import * as pdfjsLib from './lib/pdf.mjs';
    (function(){
      const urlParams = new URLSearchParams(window.location.search);
      const pk = urlParams.get('filepk');
      if (!pk) { document.getElementById('viewerMessage').textContent = 'Kein Dokument angegeben'; return; }
      const pdfUrl = '/documents/pdf/' + encodeURIComponent(pk);

      // PDF.js worker config (ESM build)
      pdfjsLib.GlobalWorkerOptions.workerSrc = './lib/pdf.worker.mjs';

      const viewerContainer = document.getElementById('viewerContainer');
      const zoomSelect = document.getElementById('zoomSelect');

      let currentZoom = parseFloat(zoomSelect.value);
      zoomSelect.addEventListener('change', () => { currentZoom = parseFloat(zoomSelect.value); renderAllPages(); });

      let pdfDoc = null;
      const pageCanvases = [];

      function clearViewer() {
        viewerContainer.innerHTML = '';
        pageCanvases.length = 0;
      }

      function renderPageToCanvas(page, scale) {
        const viewport = page.getViewport({scale});
        const canvas = document.createElement('canvas');
        canvas.className = 'pageCanvas';
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const ctx = canvas.getContext('2d');
        const renderTask = page.render({canvasContext: ctx, viewport});
        return renderTask.promise.then(() => canvas);
      }

      function renderAllPages() {
        if (!pdfDoc) return Promise.resolve();
        viewerContainer.innerHTML = '';
        const promises = [];
        for (let i=1;i<=pdfDoc.numPages;i++) {
          promises.push(pdfDoc.getPage(i).then(page => renderPageToCanvas(page, currentZoom).then(canvas => {
            canvas.dataset.pageNumber = i;
            viewerContainer.appendChild(canvas);
            pageCanvases[i] = canvas;
          })));
        }
        return Promise.all(promises).then(()=>setupSelection());
      }

      function setupSelection() {
        // remove existing selectionRect if any
        let sel = document.getElementById('selectionRect');
        if (sel) sel.remove();
        sel = document.createElement('div');
        sel.id = 'selectionRect';
        sel.className = 'selectionRect';
        viewerContainer.appendChild(sel);

        let isDragging = false;
        let startX = 0, startY = 0;
        let currentCanvas = null;

        function toViewerCoords(clientX, clientY, canvas) {
          const canvasRect = canvas.getBoundingClientRect();
          const vx = clientX - canvasRect.left;
          const vy = clientY - canvasRect.top;
          return {x: vx, y: vy, canvasRect};
        }

        viewerContainer.addEventListener('mousedown', (e) => {
          const canvas = e.target.closest('.pageCanvas');
          if (!canvas) return;
          e.preventDefault();
          isDragging = true;
          currentCanvas = canvas;
          const coords = toViewerCoords(e.clientX, e.clientY, canvas);
          startX = coords.x;
          startY = coords.y;
          // position sel relative to viewerContainer
          const parentRect = viewerContainer.getBoundingClientRect();
          const left = canvas.offsetLeft + startX;
          const top = canvas.offsetTop + startY;
          sel.style.left = left + 'px';
          sel.style.top = top + 'px';
          sel.style.width = '0px';
          sel.style.height = '0px';
          sel.style.display = 'block';
          document.body.style.userSelect = 'none';
        });

        viewerContainer.addEventListener('mousemove', (e) => {
          if (!isDragging || !currentCanvas) return;
          const coords = toViewerCoords(e.clientX, e.clientY, currentCanvas);
          const cx = coords.x;
          const cy = coords.y;
          const left = Math.min(startX, cx);
          const top = Math.min(startY, cy);
          const width = Math.abs(cx - startX);
          const height = Math.abs(cy - startY);
          sel.style.left = (currentCanvas.offsetLeft + left) + 'px';
          sel.style.top = (currentCanvas.offsetTop + top) + 'px';
          sel.style.width = width + 'px';
          sel.style.height = height + 'px';
        });

        viewerContainer.addEventListener('mouseup', (e) => {
          if (!isDragging || !currentCanvas) return;
          isDragging = false;
          document.body.style.userSelect = '';
          const coords = toViewerCoords(e.clientX, e.clientY, currentCanvas);
          const endX = coords.x;
          const endY = coords.y;
          const left = Math.min(startX, endX);
          const top = Math.min(startY, endY);
          const width = Math.abs(endX - startX);
          const height = Math.abs(endY - startY);
          sel.style.left = (currentCanvas.offsetLeft + left) + 'px';
          sel.style.top = (currentCanvas.offsetTop + top) + 'px';
          sel.style.width = width + 'px';
          sel.style.height = height + 'px';

          // compute percentages relative to canvas size
          const canvasW = currentCanvas.clientWidth || currentCanvas.width;
          const canvasH = currentCanvas.clientHeight || currentCanvas.height;
          const xFrom = (left / canvasW) * 100;
          const xTo = ((left + width) / canvasW) * 100;
          const yFrom = (top / canvasH) * 100;
          const yTo = ((top + height) / canvasH) * 100;

          // call backend extract API
          fetch(`/documents/pdf/${encodeURIComponent(pk)}/extract?xFrom=${encodeURIComponent(xFrom)}&xTo=${encodeURIComponent(xTo)}&yFrom=${encodeURIComponent(yFrom)}&yTo=${encodeURIComponent(yTo)}`)
            .then(r => {
              if (!r.ok) throw new Error('Server error ' + r.status);
              return r.text();
            })
            .then(text => {
              if (!text) text = '(Keine Textausgabe)';
              // simple feedback — replace with nicer UI later
              alert('Ausgewählter Text:\n\n' + text);
            }).catch(err => {
              console.error('Extraction failed', err);
              alert('Fehler bei der Textextraktion: ' + err.message);
            })
            .finally(() => {
              // hide selection after a short delay
              setTimeout(() => { sel.style.display = 'none'; }, 800);
            });
        });
      }

      pdfjsLib.getDocument({ url: pdfUrl }).promise.then(doc => {
        pdfDoc = doc;
        // Render pages at current zoom
        renderAllPages();
      }).catch(err=>{
        document.getElementById('viewerMessage').textContent = 'Fehler beim Laden des PDF: ' + err.message;
      });

      // sidebar removed
    })();
  </script>
</body>
</html>
