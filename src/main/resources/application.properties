server.port=8084
server.address=127.0.0.1
spring.application.name=kontoauszuege-app

# Vaadin settings
vaadin.launch-browser=true
vaadin.allowed-packages=com.example.kontoauszuege

# --- Datenbank: H2 (Datei) im PostgreSQL-Kompatibilitätsmodus ---
# Die DB-Datei liegt im Home-Verzeichnis unter .jbanking/ und wird bei Bedarf neu angelegt.
# Das Verzeichnis .jbanking wird beim Start in Application.main() erzeugt.
spring.datasource.url=jdbc:h2:file:${user.home}/.jbanking/jbanking;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate verwaltet das Schema NICHT selbst - das übernimmt Flyway.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Flyway (Schema-Versionierung) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

